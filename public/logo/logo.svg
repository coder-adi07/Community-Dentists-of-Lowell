<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Symbol Mark -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2476A8" />
        <stop offset="60%" stop-color="#16537E" />
        <stop offset="100%" stop-color="#102D46" />
      </linearGradient>
      <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2DD4BF" />
        <stop offset="100%" stop-color="#0D9488" />
      </linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#102D46" flood-opacity="0.12" />
      </filter>
    </defs>
    
    <!-- Stylized Tooth & Care Heart Shield -->
    <path d="M32 4 C18 4, 8 16, 8 30 C8 44, 16 56, 24 64 C26 66, 28 66, 30 63 C32 59, 33 52, 34 46 C34 44, 36 44, 36 46 C37 52, 38 59, 40 63 C42 66, 44 66, 46 64 C54 56, 62 44, 62 30 C62 16, 52 4, 38 4 C35 4, 33 6, 32 8 C31 6, 29 4, 32 4 Z" 
          fill="url(#logoGrad)" filter="url(#shadow)" />
          
    <!-- Enamel Smile Arc -->
    <path d="M19 28 C26 38, 38 38, 45 28" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95" />
          
    <!-- Radiance / Sparkle -->
    <path d="M48 10 L50 14 L54 16 L50 18 L48 22 L46 18 L42 16 L46 14 Z" 
          fill="url(#sparkleGrad)" />
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(85, 26)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#102D46" letter-spacing="-0.3">
      COMMUNITY DENTISTS
    </text>
    <text x="0" y="19" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2476A8" letter-spacing="2.8">
      OF LOWELL
    </text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.5">
      DR. MARY SCANNELL, DMD
    </text>
  </g>
</svg>

